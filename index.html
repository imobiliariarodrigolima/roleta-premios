
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta de Prêmios</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/winwheel@2.7.0/Winwheel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
</head>
<body>
  <h1>Gire a Roleta e Ganhe Prêmios!</h1>
  <canvas id="canvas" width="400" height="400"></canvas>
  <button id="botaoGirar" onclick="girarRoleta()">GIRAR</button>

  <div id="formulario">
    <h3>Receba seu prêmio:</h3>
    <input type="text" id="nome" placeholder="Seu nome" required>
    <input type="tel" id="whatsapp" placeholder="Seu WhatsApp" required>
    <button onclick="enviarFormulario()">ENVIAR</button>
  </div>

  <script src="roleta.js"></script>
</body>
</html>
